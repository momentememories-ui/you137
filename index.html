<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish</title>
    <!-- นำเข้าฟอนต์คณิตศาสตร์ (KaTeX Main Font) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ล็อกไม่ให้หน้าจอเลื่อน ขยับ หรือ Zoom ได้เด็ดขาด */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
            background-color: #fff0f5;
            font-family: 'KaTeX_Main', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* Floating Emojis Background */
        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 7s linear infinite;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ข้อความคำสั่ง ขยับลงมา 3 ซม. (110px) */
        .instruction-text {
            color: #ff4d6d;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 10;
            margin-top: 110px;
            min-height: 2.5rem;
            text-align: center;
            padding: 0 10px;
            position: absolute;
            top: 0;
            width: 100%;
        }

        /* พื้นที่วางเค้กจัดกลางหน้าจอพอดี */
        #cake-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* ขยายภาพเค้กขึ้นอีก 15% */
        #cake-container img.cake-base {
            width: 115vw;
            max-width: 517px; /* 450px + 15% */
            height: 100vh;
            max-height: 690px; /* 600px + 15% */
            object-fit: contain;
            pointer-events: none;
        }

        /* สไตล์เทียนขนาดใหญ่ */
        .candle-item {
            position: absolute;
            width: 65px;
            height: auto;
            pointer-events: none;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        /* เอฟเฟกต์ควันตอนเป่าเทียน */
        .smoke-particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(180, 180, 180, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            animation: smokeRise 1.2s ease-out forwards;
        }

        @keyframes smokeRise {
            0% {
                opacity: 0.8;
                transform: translate(0, 0) scale(0.6);
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), -50px) scale(2.2);
            }
        }

        /* ปุ่มแอ็กชันด้านล่าง */
        .action-btn {
            display: none;
            padding: 14px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s;
            z-index: 30;
            position: absolute;
            bottom: 50px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="page6" class="page">
        <!-- ข้อความคำสั่ง -->
        <div id="instruction" class="instruction-text">ปักเทียนกัน แตะที่เค้กสิ</div>

        <!-- เค้กจัดกลางหน้าจอพอดี -->
        <div id="cake-container" onclick="plantCandle(event)">
            <img src="cake.png" alt="Anniversary Cake" class="cake-base">
        </div>

        <!-- ปุ่มสำหรับเป่า / ปุ่มรดน้ำต้นไม้ -->
        <button id="action-btn" class="action-btn" onclick="handleButtonClick()"></button>
    </div>

    <!-- Floating Emojis พื้นหลัง -->
    <script>
        const emojis = ['🌻', '🩷', '🎂'];
        const page = document.getElementById('page6');

        function createFloatingEmoji() {
            const emojiEl = document.createElement('div');
            emojiEl.className = 'floating-emoji';
            emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            emojiEl.style.left = Math.random() * 90 + '%';
            const duration = 5 + Math.random() * 5;
            emojiEl.style.animationDuration = `${duration}s`;
            
            page.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.remove();
            }, duration * 1000);
        }

        setInterval(createFloatingEmoji, 500);
    </script>

    <!-- ลอจิกการปักเทียน, เป่าเทียน และเอฟเฟกต์ควัน -->
    <script>
        let plantedCandles = 0;
        const maxCandles = 6;
        let isBlown = false;

        function plantCandle(event) {
            if (plantedCandles >= maxCandles) return;

            const container = document.getElementById('cake-container');
            const rect = container.getBoundingClientRect();

            // คำนวณพิกัดคลิกบนเค้ก
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // สร้างภาพเทียน
            const candleImg = document.createElement('img');
            candleImg.src = 'candle.png'; 
            candleImg.className = 'candle-item candle-placed';
            
            // ปรับตำแหน่งให้กึ่งกลางจุดที่แตะ
            candleImg.style.left = `${x - 32}px`;
            candleImg.style.top = `${y - 85}px`;
            
            container.appendChild(candleImg);

            // แสดงอนิเมชันปักเทียน
            setTimeout(() => {
                candleImg.style.transform = 'scale(1)';
            }, 50);

            plantedCandles++;

            // เมื่อปักครบ 6 เล่ม
            if (plantedCandles === maxCandles) {
                document.getElementById('instruction').innerText = 'เย้ อธิษฐานแล้วเป่าเลย';
                const btn = document.getElementById('action-btn');
                btn.innerText = 'แตะเพื่อเป่า 🕯️';
                btn.style.display = 'inline-block';
            }
        }

        // ฟังก์ชันสร้างเอฟเฟกต์ควันลอยขึ้นจากหัวเทียน
        function createSmoke(candleEl) {
            const container = document.getElementById('cake-container');
            const candleLeft = parseFloat(candleEl.style.left);
            const candleTop = parseFloat(candleEl.style.top);

            // ตำแหน่งปลายยอดเทียน
            const flameX = candleLeft + 32;
            const flameY = candleTop + 10;

            // สร้างก้อนควัน 5 ก้อนกระจายออก
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke-particle';
                    smoke.style.left = `${flameX - 10}px`;
                    smoke.style.top = `${flameY - 10}px`;
                    
                    // สุ่มการลอยเบี่ยงซ้าย-ขวา
                    const dx = (Math.random() - 0.5) * 40;
                    smoke.style.setProperty('--dx', `${dx}px`);

                    container.appendChild(smoke);

                    setTimeout(() => {
                        smoke.remove();
                    }, 1200);
                }, i * 150);
            }
        }

        function handleButtonClick() {
            const btn = document.getElementById('action-btn');

            if (!isBlown) {
                // เปลี่ยนไฟล์รูปภาพเทียนเป็น candle-off.png พร้อมสร้างเอฟเฟกต์ควัน
                const candles = document.querySelectorAll('.candle-placed');
                candles.forEach(candle => {
                    candle.src = 'candle-off.png';
                    createSmoke(candle);
                });

                isBlown = true;

                // เปลี่ยนข้อความและปุ่มเป็นขั้นตอนถัดไป
                document.getElementById('instruction').innerText = '';
                btn.innerText = 'ช่วยเค้ารดน้ำต้นไม้หน่อยนะ 🪴';
            } else {
                alert('ไปหน้ารดน้ำต้นไม้กันเลย! 🌱');
            }
        }
    </script>
</body>
</html>
