<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish - Anniversary</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            width: 100%;
            height: 100%;
            position: relative;
            text-align: center;
        }
        h2 {
            color: #ff4d6d;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        #cake-container {
            position: relative;
            cursor: pointer;
            display: inline-block;
        }
        #cake-container img.cake-base {
            width: 240px;
            display: block;
            user-select: none;
        }
        #candle-status {
            margin-top: 25px;
            color: #ff758f;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .next-btn {
            display: none;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: #ff4d6d;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,77,109,0.3);
            transition: transform 0.2s;
        }
        .next-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="page6" class="page">
        <h2>Make a Wish! 🎂</h2>
        <p>จิ้มที่เค้กเพื่อปักเทียนวันครบรอบของเรากันนะ (ปักให้ครบ 3 เล่มน้า)</p>

        <div id="cake-container" onclick="plantCandle(event)">
            <img src="cake.png" alt="Anniversary Cake" class="cake-base">
        </div>

        <p id="candle-status">ปักเทียนไปแล้ว: <span id="candle-count">0</span> / 3</p>

        <button id="final-next-btn" class="next-btn" onclick="alert('ไปหน้าถัดไปสำเร็จ!')">
            Go to Next Page ✨
        </button>
    </div>

    <script>
        let burnedCandles = 0;
        const maxCandles = 3;

        function plantCandle(event) {
            if (burnedCandles >= maxCandles) return;

            const container = document.getElementById('cake-container');
            const rect = container.getBoundingClientRect();

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const candleImg = document.createElement('img');
            // สามารถเปลี่ยนเป็น 'candleoff.png' ได้ถ้าต้องการแบบยังไม่จุดไฟ
            candleImg.src = 'candle.png'; 
            candleImg.style.position = 'absolute';
            candleImg.style.left = `${x - 12}px`;
            candleImg.style.top = `${y - 45}px`;
            candleImg.style.width = '24px';
            candleImg.style.pointerEvents = 'none';
            candleImg.style.transform = 'scale(0)';
            candleImg.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            
            container.appendChild(candleImg);

            setTimeout(() => {
                candleImg.style.transform = 'scale(1)';
            }, 50);

            burnedCandles++;
            document.getElementById('candle-count').innerText = burnedCandles;

            if (burnedCandles === maxCandles) {
                document.getElementById('candle-status').innerHTML = '🎉 เย้! ปักเทียนครบแล้ว อธิษฐานกันเถอะ!';
                document.getElementById('final-next-btn').style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
