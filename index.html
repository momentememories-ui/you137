<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* กำหนดฟอนต์คณิตศาสตร์ */
            font-family: 'KaTeX_Main', 'Times New Roman', serif;
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Responsive Mobile Container (อัตราส่วนแนวตั้ง 9:16) */
        .page {
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            position: relative;
            text-align: center;
            overflow: hidden;
            background-color: #fff0f5;
        }

        /* Floating Emojis Background (ทานตะวัน, หัวใจ, เค้ก) */
        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 28px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ข้อความคำสั่ง */
        .instruction-text {
            color: #ff4d6d;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            margin-top: 10px;
            min-height: 2.5rem;
        }

        /* รูปเค้กเต็มหน้าจอ */
        #cake-container {
            position: relative;
            cursor: pointer;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #cake-container img.cake-base {
            width: 100%;
            max-width: 380px;
            max-height: 60vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* สไตล์เทียนขนาดใหญ่ */
        .candle-item {
            position: absolute;
            width: 60px; /* ปรับขนาดเทียนให้ใหญ่ขึ้น */
            height: auto;
            pointer-events: none;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        /* ปุ่มอธิษฐาน */
        .wish-btn {
            display: none;
            padding: 15px 35px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, background 0.3s;
            z-index: 10;
            margin-bottom: 20px;
        }

        .wish-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="page6" class="page">
        <div id="instruction" class="instruction-text">ปักเทียนกัน</div>

        <div id="cake-container" onclick="plantCandle(event)">
            <img src="cake.png" alt="Anniversary Cake" class="cake-base">
        </div>

        <button id="wish-btn" class="wish-btn" onclick="makeWish()">
            อธิษฐานกันเถอะ ✨
        </button>
    </div>

    <script>
        const emojis = ['🌻', '🩷', '🎂'];
        const page = document.getElementById('page6');

        function createFloatingEmoji() {
            const emojiEl = document.createElement('div');
            emojiEl.className = 'floating-emoji';
            emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // สุ่มตำแหน่ง X และระยะเวลาอนิเมชัน
            emojiEl.style.left = Math.random() * 90 + '%';
            const duration = 6 + Math.random() * 6;
            emojiEl.style.animationDuration = `${duration}s`;
            
            page.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.remove();
            }, duration * 1000);
        }

        // สร้างอิโมจิลอยขึ้นมาเรื่อยๆ
        setInterval(createFloatingEmoji, 600);
    </script>

    <script>
        let plantedCandles = 0;
        const maxCandles = 6;

        function plantCandle(event) {
            if (plantedCandles >= maxCandles) return;

            const container = document.getElementById('cake-container');
            const rect = container.getBoundingClientRect();

            // คำนวณพิกัดคลิก
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // สร้างรูปเทียน
            const candleImg = document.createElement('img');
            candleImg.src = 'candle.png'; 
            candleImg.className = 'candle-item';
            
            // จัดกึ่งกลางตำแหน่งเทียนตามจุดที่คลิก (ใช้ขนาดเทียน 60px)
            candleImg.style.left = `${x - 30}px`;
            candleImg.style.top = `${y - 80}px`;
            
            container.appendChild(candleImg);

            // แสดงเทียนขยายขึ้นมา
            setTimeout(() => {
                candleImg.style.transform = 'scale(1)';
            }, 50);

            plantedCandles++;

            // เมื่อปักเล่มแรก ข้อความแนะนำจะหายไป
            if (plantedCandles === 1) {
                document.getElementById('instruction').innerText = '';
            }

            // เมื่อปักครบ 6 เล่ม แสดงปุ่มอธิษฐาน
            if (plantedCandles === maxCandles) {
                document.getElementById('instruction').innerText = '';
                document.getElementById('wish-btn').style.display = 'inline-block';
            }
        }

        function makeWish() {
            alert('ขอให้ความปรารถนาของคุณเป็นจริง! ✨');
        }
    </script>
</body>
</html>
